<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Curtain Hero Preview</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/fonts.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Open+Sans&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <style>
        .hero-with-curtain {
            position: relative;
            width: 100%;
            min-height: 80vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--secondary-color);
        }

        .hero-curtain-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
            pointer-events: none;
        }

        .hero-curtain-content h1 {
            font-size: 4rem;
            margin: 0 0 20px 0;
            font-weight: bold;
            font-family: 'Raleway', sans-serif;
        }

        #hero-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin: 0;
            min-height: 3rem;
        }

        .hero-curtain-content p {
            font-size: 1.2rem;
            margin-top: 30px;
            opacity: 0.8;
            max-width: 600px;
            font-family: 'Open Sans', sans-serif;
        }
    </style>
</head>
<body>
    <div class="hero-with-curtain" data-light-curtain
        data-background="#000000"
        data-base-color="#62EBE1"
        data-accent-color="#FF2E63"
        data-highlight="#FF2E63"
        data-density="150"
        data-speed="9"
        data-curtain-width="30"
        data-spread="0"
        data-striation="0"
        data-hover="17"
        data-reach="10"
        data-opacity="0.3">
        <div class="hero-curtain-content">
            <h1>I'm a</h1>
            <h2 id="hero-title">Developer</h2>
            <p>Interactive 3D experiences, games, and tools</p>
        </div>
    </div>

    <script src="../js/light-curtain-shader.js"></script>
    <script src="../js/hero-titles.js"></script>
</body>
</html>
