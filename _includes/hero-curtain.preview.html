<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Curtain Preview</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        body {
            margin: 0;
            background: #EAEAEA;
        }
        .curtain-preview {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        .curtain-content {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            pointer-events: none;
        }
        .curtain-content h1 {
            font-size: 4rem;
            margin: 0;
            font-weight: bold;
        }
        .curtain-content p {
            font-size: 1.5rem;
            margin: 20px 0 0 0;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="curtain-preview" data-light-curtain>
        <div class="curtain-content">
            <h1>Light Curtain</h1>
            <p>Move your mouse to interact</p>
        </div>
    </div>

    <script src="../js/light-curtain-shader.js"></script>
</body>
</html>
