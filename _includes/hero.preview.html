<!doctype html>
<!--
  Standalone preview — open this file directly in a browser to see the
  shader visualiser render. hero.html itself is a Jekyll/Liquid fragment
  (root-relative asset paths, {% include %} vars) and won't render if
  opened on its own, so this mirrors its markup with plain relative paths.
-->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero preview</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/fonts.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Open+Sans&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <div class="hero" data-light-curtain
            data-background="#000000"
            data-base-color="#62EBE1"
            data-accent-color="#4FD5C8"
            data-highlight="#2E9B94"
            data-density="150"
            data-speed="9"
            data-curtain-width="30"
            data-spread="0"
            data-striation="0"
            data-hover="17"
            data-reach="10"
            data-opacity="0.3">
            <img src="../img/Landing1.png" alt="" aria-hidden="true">
            <div class="hero-text">
                <h1>Check out some of my work!</h1>
            </div>
        </div>
    </header>
    <script src="../js/light-curtain-shader.js" defer></script>
</body>

</html>
