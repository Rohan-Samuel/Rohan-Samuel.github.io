<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Work | Rohan Samuel</title>
    <meta name="description" content="3D art and asset work by Rohan Samuel.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='6'%20fill='%23252A34'/%3E%3Ctext%20x='16'%20y='22'%20font-family='Arial,sans-serif'%20font-size='15'%20font-weight='700'%20fill='%23FF2E63'%20text-anchor='middle'%3ERS%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="../css/styles.css?v={{ site.time | date: '%s' }}">
    <link rel="stylesheet" href="../css/fonts.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Open+Sans&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/fef65e84fa.js" crossorigin="anonymous"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>

    <style>
        /* ============= 3D Gallery ============= */
        .gallery-3d {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            grid-auto-rows: 170px;
            grid-auto-flow: dense;
            gap: 18px;
            margin-top: 20px;
        }

        .gallery-3d-item.is-featured {
            grid-column: span 2;
            grid-row: span 2;
        }

        .gallery-3d-item {
            position: relative;
            margin: 0;
            border-radius: 5px;
            overflow: hidden;
            cursor: pointer;
            border: none;
            padding: 0;
            background: none;
        }

        .gallery-3d-item img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease, opacity 0.15s ease;
        }

        .gallery-3d-item:hover img {
            transform: scale(1.06);
        }

        .gallery-3d-item .overlay {
            background: linear-gradient(to top, rgba(0, 0, 0, 0.88) 0%, rgba(0, 0, 0, 0.4) 45%, rgba(0, 0, 0, 0) 75%);
            align-items: flex-end;
            justify-content: flex-start;
            text-align: left;
            padding: 14px;
            box-sizing: border-box;
            opacity: 0;
        }

        .gallery-3d-item:hover .overlay {
            opacity: 1;
        }

        .gallery-3d-item .overlay-inner {
            width: 100%;
        }

        .gallery-3d-item .overlay h3 {
            font-size: 1.1rem;
            margin: 0;
            padding: 0;
            text-align: left;
        }

        .gallery-3d-item .overlay .gallery-3d-meta__kicker {
            margin: 4px 0 0;
            font-size: 0.75rem;
            font-weight: 600;
            color: #fff;
        }

        .gallery-3d-item .overlay .gallery-3d-meta__tech {
            margin: 2px 0 0;
            font-size: 0.7rem;
            color: #ddd;
        }

        /* ============= Featured 3D Model ============= */
        .featured-models {
            margin-top: 20px;
        }

        .featured-models-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            justify-items: center;
            gap: 24px;
            margin-top: 20px;
        }

        .featured-model-card {
            width: 100%;
            max-width: 640px;
            background-color: var(--secondary-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .featured-model-card model-viewer {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 10;
            background-color: #111;
            --poster-color: #111;
        }

        .featured-model-card__body {
            padding: 16px 20px 20px;
        }

        .featured-model-card__title {
            margin: 0;
            color: #fff;
            font-size: 1.2rem;
        }

        .featured-model-card__kicker {
            margin: 6px 0 0;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--primary-color);
        }

        .featured-model-card__tech {
            margin: 2px 0 0;
            font-size: 0.75rem;
            color: #bbb;
        }

        .featured-model-card__hint {
            margin: 12px 0 0;
            font-size: 0.72rem;
            color: #888;
        }

        /* ============= Lightbox ============= */
        .lightbox-3d {
            position: fixed;
            inset: 0;
            background-color: rgba(10, 10, 12, 0.9);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease;
        }

        .lightbox-3d.is-open {
            opacity: 1;
            visibility: visible;
        }

        .lightbox-3d__content {
            position: relative;
            width: min(900px, 90vw);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .lightbox-3d__close {
            position: absolute;
            top: -46px;
            right: 0;
            margin: 0;
            background: none;
            border: 2px solid #fff;
            color: #fff;
            border-radius: 5px;
            padding: 8px 16px;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: inherit;
        }

        .lightbox-3d__close:hover {
            background-color: #fff;
            color: var(--secondary-color);
        }

        .lightbox-3d__title {
            color: #fff;
            margin: 0;
            text-align: center;
        }

        .lightbox-3d__counter {
            color: #ccc;
            margin: -10px 0 0;
            text-align: center;
            font-size: 0.85rem;
        }

        .lightbox-3d__view-toggle {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: -6px 0 0;
        }

        .lightbox-3d__view-toggle button {
            margin: 0;
            padding: 6px 16px;
            font-size: 0.8rem;
            font-weight: 600;
            font-family: inherit;
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #ccc;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .lightbox-3d__view-toggle button.is-active {
            background-color: var(--tertiary-color);
            border-color: var(--tertiary-color);
            color: #fff;
        }

        .lightbox-3d__main {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            border-radius: 5px;
            overflow: hidden;
            background-color: #111;
            touch-action: pan-y;
        }

        .lightbox-3d__main img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            user-select: none;
            -webkit-user-drag: none;
        }

        .lightbox-3d__model {
            display: none;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            --poster-color: #111;
        }

        .lightbox-3d.is-viewing-model .lightbox-3d__model {
            display: block;
        }

        .lightbox-3d.is-viewing-model .lightbox-3d__main img,
        .lightbox-3d.is-viewing-model .lightbox-3d__nav {
            visibility: hidden;
        }

        .lightbox-3d__nav {
            position: absolute;
            top: 0;
            height: 100%;
            width: 60px;
            margin: 0;
            border: none;
            background: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0);
            transition: background-color 0.2s ease;
        }

        .lightbox-3d__nav:hover {
            background-color: rgba(0, 0, 0, 0.35);
        }

        .lightbox-3d__nav--prev {
            left: 0;
        }

        .lightbox-3d__nav--next {
            right: 0;
        }

        .lightbox-3d__strip {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .lightbox-3d__strip img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0.5;
            border: 2px solid transparent;
            transition: opacity 0.2s ease, border-color 0.2s ease;
            flex-shrink: 0;
        }

        .lightbox-3d__strip img:hover {
            opacity: 0.85;
        }

        .lightbox-3d__strip img.is-active {
            opacity: 1;
            border-color: var(--tertiary-color);
        }

        @media (max-width: 600px) {
            .lightbox-3d__strip img {
                width: 60px;
                height: 60px;
            }

            .lightbox-3d__nav {
                width: 44px;
                font-size: 1.5rem;
            }

            .gallery-3d-item.is-featured {
                grid-column: span 1;
                grid-row: span 1;
            }
        }
    </style>

</head>

<body>
    {% include nav.html %}

    {% include hero.html title="Check out my 3D assets" %}

    <div class="container featured-models" id="featured-models" hidden>
        <h2 id="featured-models-heading">Featured 3D Model</h2>
        <div class="featured-models-grid" id="featured-models-grid">
            <!-- Populated by script below -->
        </div>
    </div>

    <div class="container" id="project-gallery">
        <h2>Projects</h2>
        <div class="gallery-3d" id="gallery-3d">
            <!-- Populated by script below -->
        </div>
        <div class="more-work-btn-container">
            <a href="../index.html" class="more-work-btn">Back to Home</a>
        </div>
    </div>

    <div class="lightbox-3d" id="lightbox-3d">
        <div class="lightbox-3d__content" id="lightbox-3d-content">
            <button type="button" class="lightbox-3d__close" id="lightbox-3d-close">&larr; Back</button>
            <h3 class="lightbox-3d__title" id="lightbox-3d-title"></h3>
            <p class="lightbox-3d__counter" id="lightbox-3d-counter"></p>
            <div class="lightbox-3d__view-toggle" id="lightbox-3d-view-toggle" hidden>
                <button type="button" class="is-active" id="lightbox-3d-view-images">Images</button>
                <button type="button" id="lightbox-3d-view-model">3D Model</button>
            </div>
            <div class="lightbox-3d__main">
                <button type="button" class="lightbox-3d__nav lightbox-3d__nav--prev" id="lightbox-3d-prev" aria-label="Previous image">&#8249;</button>
                <img id="lightbox-3d-main-img" src="" alt="">
                <button type="button" class="lightbox-3d__nav lightbox-3d__nav--next" id="lightbox-3d-next" aria-label="Next image">&#8250;</button>
                <model-viewer class="lightbox-3d__model" id="lightbox-3d-model" camera-controls auto-rotate shadow-intensity="1"></model-viewer>
            </div>
            <div class="lightbox-3d__strip" id="lightbox-3d-strip"></div>
        </div>
    </div>

    {% include footer.html %}

    <script>
        const projects3d = [
            {
                title: "Sculpted Relic",
                kicker: "Prop · Environment Storytelling",
                tech: "ZBrush · Substance Painter",
                featured: true,
                model: "https://modelviewer.dev/shared-assets/models/Astronaut.glb",
                images: [
                    "https://picsum.photos/seed/relic1/900/560",
                    "https://picsum.photos/seed/relic2/900/560",
                    "https://picsum.photos/seed/relic3/900/560",
                    "https://picsum.photos/seed/relic4/900/560",
                ],
            },
            {
                title: "Modular Sci-Fi Kit",
                kicker: "Hard Surface · Modular Set",
                tech: "Blender · Substance Painter",
                images: [
                    "https://picsum.photos/seed/scifi1/900/560",
                    "https://picsum.photos/seed/scifi2/900/560",
                    "https://picsum.photos/seed/scifi3/900/560",
                ],
            },
            {
                title: "Stylized Creature",
                kicker: "Character · Stylized",
                tech: "ZBrush · Maya · Substance Painter",
                images: [
                    "https://picsum.photos/seed/creature1/900/560",
                    "https://picsum.photos/seed/creature2/900/560",
                    "https://picsum.photos/seed/creature3/900/560",
                    "https://picsum.photos/seed/creature4/900/560",
                    "https://picsum.photos/seed/creature5/900/560",
                ],
            },
            {
                title: "Hard Surface Vehicle",
                kicker: "Vehicle · Hard Surface",
                tech: "Maya · Substance Painter",
                images: [
                    "https://picsum.photos/seed/vehicle1/900/560",
                    "https://picsum.photos/seed/vehicle2/900/560",
                    "https://picsum.photos/seed/vehicle3/900/560",
                ],
            },
            {
                title: "Environment Set Piece",
                kicker: "Environment · Set Dressing",
                tech: "Blender · Unity",
                featured: true,
                images: [
                    "https://picsum.photos/seed/env1/900/560",
                    "https://picsum.photos/seed/env2/900/560",
                    "https://picsum.photos/seed/env3/900/560",
                    "https://picsum.photos/seed/env4/900/560",
                ],
            },
            {
                title: "Character Bust",
                kicker: "Character · Portrait Study",
                tech: "ZBrush · KeyShot",
                images: [
                    "https://picsum.photos/seed/bust1/900/560",
                    "https://picsum.photos/seed/bust2/900/560",
                    "https://picsum.photos/seed/bust3/900/560",
                ],
            },
            {
                title: "Weapon Set",
                kicker: "Prop · Weapon Design",
                tech: "Maya · Substance Painter",
                images: [
                    "https://picsum.photos/seed/weapon1/900/560",
                    "https://picsum.photos/seed/weapon2/900/560",
                    "https://picsum.photos/seed/weapon3/900/560",
                    "https://picsum.photos/seed/weapon4/900/560",
                ],
            },
            {
                title: "Prop Study",
                kicker: "Prop · Texture Study",
                tech: "Substance Painter · Marmoset",
                images: [
                    "https://picsum.photos/seed/prop1/900/560",
                    "https://picsum.photos/seed/prop2/900/560",
                    "https://picsum.photos/seed/prop3/900/560",
                ],
            },
            {
                title: "Architectural Render",
                kicker: "Environment · Archviz",
                tech: "Blender · Unreal Engine",
                images: [
                    "https://picsum.photos/seed/arch1/900/560",
                    "https://picsum.photos/seed/arch2/900/560",
                    "https://picsum.photos/seed/arch3/900/560",
                    "https://picsum.photos/seed/arch4/900/560",
                ],
            },
        ];

        const HOVER_PREVIEW_LIMIT = 3;
        const HOVER_PREVIEW_INTERVAL_MS = 800;
        const SWIPE_THRESHOLD_PX = 40;

        const featuredModelsSectionEl = document.getElementById("featured-models");
        const featuredModelsHeadingEl = document.getElementById("featured-models-heading");
        const featuredModelsGridEl = document.getElementById("featured-models-grid");
        const galleryEl = document.getElementById("gallery-3d");
        const lightboxEl = document.getElementById("lightbox-3d");
        const lightboxContentEl = document.getElementById("lightbox-3d-content");
        const lightboxMainEl = document.querySelector(".lightbox-3d__main");
        const lightboxCloseEl = document.getElementById("lightbox-3d-close");
        const lightboxTitleEl = document.getElementById("lightbox-3d-title");
        const lightboxCounterEl = document.getElementById("lightbox-3d-counter");
        const lightboxMainImgEl = document.getElementById("lightbox-3d-main-img");
        const lightboxStripEl = document.getElementById("lightbox-3d-strip");
        const lightboxPrevEl = document.getElementById("lightbox-3d-prev");
        const lightboxNextEl = document.getElementById("lightbox-3d-next");
        const lightboxViewToggleEl = document.getElementById("lightbox-3d-view-toggle");
        const lightboxViewImagesEl = document.getElementById("lightbox-3d-view-images");
        const lightboxViewModelEl = document.getElementById("lightbox-3d-view-model");
        const lightboxModelEl = document.getElementById("lightbox-3d-model");

        let currentProject = null;
        let currentIndex = 0;
        let lastScrollTime = 0;
        let touchStartX = null;

        function renderGallery() {
            projects3d.forEach((project, index) => {
                const item = document.createElement("button");
                item.type = "button";
                item.className = "gallery-3d-item" + (project.featured ? " is-featured" : "");
                item.setAttribute("aria-label", "View " + project.title);

                const img = document.createElement("img");
                img.src = project.images[0];
                img.alt = project.title + " preview";
                item.appendChild(img);

                const overlay = document.createElement("div");
                overlay.className = "overlay";

                const overlayInner = document.createElement("div");
                overlayInner.className = "overlay-inner";

                const h3 = document.createElement("h3");
                h3.textContent = project.title;
                overlayInner.appendChild(h3);

                const kicker = document.createElement("p");
                kicker.className = "gallery-3d-meta__kicker";
                kicker.textContent = project.kicker;
                overlayInner.appendChild(kicker);

                const tech = document.createElement("p");
                tech.className = "gallery-3d-meta__tech";
                tech.textContent = project.tech;
                overlayInner.appendChild(tech);

                overlay.appendChild(overlayInner);
                item.appendChild(overlay);

                item.addEventListener("click", () => openLightbox(index));
                attachHoverPreview(item, img, project);

                galleryEl.appendChild(item);
            });
        }

        function renderFeaturedModels() {
            const featuredModels = projects3d.filter((project) => project.model);
            if (featuredModels.length === 0) return;

            featuredModelsHeadingEl.textContent = featuredModels.length > 1 ? "Featured 3D Models" : "Featured 3D Model";

            featuredModels.forEach((project) => {
                const card = document.createElement("div");
                card.className = "featured-model-card";

                const viewer = document.createElement("model-viewer");
                viewer.setAttribute("src", project.model);
                viewer.setAttribute("camera-controls", "");
                viewer.setAttribute("auto-rotate", "");
                viewer.setAttribute("shadow-intensity", "1");
                card.appendChild(viewer);

                const body = document.createElement("div");
                body.className = "featured-model-card__body";

                const h3 = document.createElement("h3");
                h3.className = "featured-model-card__title";
                h3.textContent = project.title;
                body.appendChild(h3);

                const kicker = document.createElement("p");
                kicker.className = "featured-model-card__kicker";
                kicker.textContent = project.kicker;
                body.appendChild(kicker);

                const tech = document.createElement("p");
                tech.className = "featured-model-card__tech";
                tech.textContent = project.tech;
                body.appendChild(tech);

                const hint = document.createElement("p");
                hint.className = "featured-model-card__hint";
                hint.textContent = "Drag to orbit · Scroll to zoom";
                body.appendChild(hint);

                card.appendChild(body);
                featuredModelsGridEl.appendChild(card);
            });

            featuredModelsSectionEl.hidden = false;
        }

        function attachHoverPreview(item, img, project) {
            const previewImages = project.images.slice(0, HOVER_PREVIEW_LIMIT);
            if (previewImages.length <= 1) return;

            let previewIndex = 0;
            let intervalId = null;

            item.addEventListener("mouseenter", () => {
                intervalId = setInterval(() => {
                    previewIndex = (previewIndex + 1) % previewImages.length;
                    img.src = previewImages[previewIndex];
                }, HOVER_PREVIEW_INTERVAL_MS);
            });

            item.addEventListener("mouseleave", () => {
                clearInterval(intervalId);
                previewIndex = 0;
                img.src = project.images[0];
            });
        }

        function renderStrip() {
            lightboxStripEl.innerHTML = "";
            currentProject.images.forEach((src, index) => {
                const thumb = document.createElement("img");
                thumb.src = src;
                thumb.alt = currentProject.title + " image " + (index + 1);
                if (index === currentIndex) {
                    thumb.classList.add("is-active");
                }
                thumb.addEventListener("click", () => showImage(index));
                lightboxStripEl.appendChild(thumb);
            });
        }

        function showImage(index) {
            const total = currentProject.images.length;
            currentIndex = (index + total) % total;
            lightboxMainImgEl.src = currentProject.images[currentIndex];
            lightboxMainImgEl.alt = currentProject.title + " image " + (currentIndex + 1);
            lightboxCounterEl.textContent = (currentIndex + 1) + " / " + total;

            const thumbs = lightboxStripEl.querySelectorAll("img");
            thumbs.forEach((thumb, i) => {
                thumb.classList.toggle("is-active", i === currentIndex);
            });
            const activeThumb = thumbs[currentIndex];
            if (activeThumb) {
                activeThumb.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
            }
        }

        function showImagesView() {
            lightboxEl.classList.remove("is-viewing-model");
            lightboxViewImagesEl.classList.add("is-active");
            lightboxViewModelEl.classList.remove("is-active");
            lightboxModelEl.removeAttribute("src");
        }

        function showModelView() {
            if (!currentProject || !currentProject.model) return;
            lightboxModelEl.setAttribute("src", currentProject.model);
            lightboxEl.classList.add("is-viewing-model");
            lightboxViewModelEl.classList.add("is-active");
            lightboxViewImagesEl.classList.remove("is-active");
        }

        function openLightbox(projectIndex) {
            currentProject = projects3d[projectIndex];
            currentIndex = 0;
            lightboxTitleEl.textContent = currentProject.title;
            lightboxViewToggleEl.hidden = !currentProject.model;
            renderStrip();
            showImage(0);
            showImagesView();
            lightboxEl.classList.add("is-open");
            document.body.style.overflow = "hidden";
        }

        function closeLightbox() {
            lightboxEl.classList.remove("is-open");
            document.body.style.overflow = "";
            showImagesView();
            currentProject = null;
        }

        renderFeaturedModels();
        renderGallery();

        lightboxCloseEl.addEventListener("click", closeLightbox);
        lightboxPrevEl.addEventListener("click", () => showImage(currentIndex - 1));
        lightboxNextEl.addEventListener("click", () => showImage(currentIndex + 1));
        lightboxViewImagesEl.addEventListener("click", showImagesView);
        lightboxViewModelEl.addEventListener("click", showModelView);

        lightboxEl.addEventListener("click", (event) => {
            if (event.target === lightboxEl) {
                closeLightbox();
            }
        });

        document.addEventListener("keydown", (event) => {
            if (!lightboxEl.classList.contains("is-open")) return;
            if (event.key === "Escape") closeLightbox();
            if (lightboxEl.classList.contains("is-viewing-model")) return;
            if (event.key === "ArrowRight") showImage(currentIndex + 1);
            if (event.key === "ArrowLeft") showImage(currentIndex - 1);
        });

        lightboxContentEl.addEventListener("wheel", (event) => {
            if (!currentProject || lightboxEl.classList.contains("is-viewing-model")) return;
            event.preventDefault();
            const now = Date.now();
            if (now - lastScrollTime < 350) return;
            lastScrollTime = now;
            if (event.deltaY > 0) {
                showImage(currentIndex + 1);
            } else if (event.deltaY < 0) {
                showImage(currentIndex - 1);
            }
        }, { passive: false });

        lightboxMainEl.addEventListener("touchstart", (event) => {
            touchStartX = event.touches[0].clientX;
        }, { passive: true });

        lightboxMainEl.addEventListener("touchend", (event) => {
            if (touchStartX === null || lightboxEl.classList.contains("is-viewing-model")) return;
            const deltaX = event.changedTouches[0].clientX - touchStartX;
            if (Math.abs(deltaX) > SWIPE_THRESHOLD_PX) {
                if (deltaX < 0) {
                    showImage(currentIndex + 1);
                } else {
                    showImage(currentIndex - 1);
                }
            }
            touchStartX = null;
        });
    </script>
</body>

</html>
